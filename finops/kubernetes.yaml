apiVersion: v1
kind: Service
metadata:
  name: insighthub-finops-gateway
  namespace: insighthub-dev
  labels: {app: insighthub-finops-gateway}
spec:
  ports: [{name: metrics, port: 4001, targetPort: 4001}]
---
apiVersion: v1
kind: Endpoints
metadata:
  name: insighthub-finops-gateway
  namespace: insighthub-dev
subsets:
  - addresses: [{ip: 172.22.0.6}]
    ports: [{name: metrics, protocol: TCP, port: 4001}]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: insighthub-finops-gateway-local
  namespace: insighthub-dev
  labels:
    kubernetes.io/service-name: insighthub-finops-gateway
    endpointslice.kubernetes.io/managed-by: insighthub-day6-local
addressType: IPv4
ports: [{name: metrics, protocol: TCP, port: 4001}]
endpoints:
  - addresses: [172.22.0.6]
    conditions: {ready: true}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: insighthub-day6-finops
  namespace: monitoring
  labels: {release: kube-prometheus-stack}
spec:
  namespaceSelector: {matchNames: [insighthub-dev]}
  selector: {matchLabels: {app: insighthub-finops-gateway}}
  endpoints: [{port: metrics, path: /metrics, interval: 15s}]
