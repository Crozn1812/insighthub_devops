# Source: insighthub/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: insighthub-postgres
  labels:
    app.kubernetes.io/name: insighthub
    app.kubernetes.io/instance: insighthub
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: postgres
spec:
  serviceName: insighthub-postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: insighthub, app.kubernetes.io/component: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: insighthub, app.kubernetes.io/component: postgres}
    spec:
      serviceAccountName: insighthub
      containers:
        - name: postgres
          image: "pgvector/pgvector:0.8.2-pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc"
          imagePullPolicy: IfNotPresent
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: insighthub}
            - {name: POSTGRES_DB, value: insighthub}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: insighthub-runtime, key: POSTGRES_PASSWORD}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d/init.sql, subPath: init.sql, readOnly: true}
          livenessProbe:
            exec: {command: [pg_isready, -U, insighthub, -d, insighthub]}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec: {command: [pg_isready, -U, insighthub, -d, insighthub]}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: "1"
              memory: 768Mi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes: [{name: init, configMap: {name: insighthub-postgres-init}}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
