        - name: redis
          image: "redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952"
          imagePullPolicy: IfNotPresent
          args: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory-policy, noeviction]
          ports: [{name: redis, containerPort: 6379}]
          volumeMounts: [{name: data, mountPath: /data}]
          livenessProbe: {exec: {command: [redis-cli, ping]}, initialDelaySeconds: 10, periodSeconds: 10}
          readinessProbe: {exec: {command: [redis-cli, ping]}, initialDelaySeconds: 5, periodSeconds: 5}
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
      volumes: [{name: data, emptyDir: {}}]
