# Source: insighthub/templates/api.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insighthub-api
  labels:
    app.kubernetes.io/name: insighthub
    app.kubernetes.io/instance: insighthub
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: insighthub, app.kubernetes.io/component: api}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: insighthub, app.kubernetes.io/component: api}
    spec:
      serviceAccountName: insighthub
      securityContext: {fsGroup: 1001}
      containers:
        - name: api
          image: "insighthub-api:day3"
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: insighthub-config}}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: insighthub-runtime, key: DATABASE_URL}}
          volumeMounts: [{name: payloads, mountPath: /app/payloads}]
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 5, periodSeconds: 5}
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes: [{name: payloads, persistentVolumeClaim: {claimName: insighthub-payloads}}]
