apiVersion: v1
kind: Service
metadata:
  name: insighthub-postgres
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: insighthub-postgres
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: insighthub-postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres}
    spec:
      serviceAccountName: insighthub
      containers:
        - name: postgres
          image: {{ .Values.images.postgres | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: insighthub}
            - {name: POSTGRES_DB, value: insighthub}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.runtimeSecretName }}, key: POSTGRES_PASSWORD}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d/init.sql, subPath: init.sql, readOnly: true}
          livenessProbe:
            exec: {command: [pg_isready, -U, insighthub, -d, insighthub]}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec: {command: [pg_isready, -U, insighthub, -d, insighthub]}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{- toYaml .Values.resources.postgres | nindent 12 }}
      volumes: [{name: init, configMap: {name: insighthub-postgres-init}}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: {{ .Values.postgres.storage }}}
