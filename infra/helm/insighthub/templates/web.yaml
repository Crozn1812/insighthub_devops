apiVersion: apps/v1
kind: Deployment
metadata:
  name: insighthub-web
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web}
    spec:
      serviceAccountName: insighthub
      containers:
        - name: web
          image: "{{ .Values.images.web.repository }}:{{ .Values.images.web.tag }}"
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: API_INTERNAL_URL, value: {{ .Values.config.apiInternalUrl | quote }}}
          livenessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 15, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 5, periodSeconds: 5}
          resources: {{- toYaml .Values.resources.web | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: insighthub-web
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web}
  ports: [{name: http, port: 3000, targetPort: http}]
