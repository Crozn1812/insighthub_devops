apiVersion: apps/v1
kind: Deployment
metadata:
  name: insighthub-redis
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: redis}
    spec:
      serviceAccountName: insighthub
      containers:
        - name: redis
          image: {{ .Values.images.redis | quote }}
          imagePullPolicy: IfNotPresent
          args: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory-policy, noeviction]
          ports: [{name: redis, containerPort: 6379}]
          volumeMounts: [{name: data, mountPath: /data}]
          livenessProbe: {exec: {command: [redis-cli, ping]}, initialDelaySeconds: 10, periodSeconds: 10}
          readinessProbe: {exec: {command: [redis-cli, ping]}, initialDelaySeconds: 5, periodSeconds: 5}
          resources: {{- toYaml .Values.resources.redis | nindent 12 }}
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: insighthub-redis
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
