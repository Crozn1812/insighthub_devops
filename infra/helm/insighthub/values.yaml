images:
  web:
    repository: insighthub-web
    tag: day3
    pullPolicy: IfNotPresent
  api:
    repository: insighthub-api
    tag: day3
    pullPolicy: IfNotPresent
  worker:
    repository: insighthub-ingestion-worker
    tag: day3
    pullPolicy: IfNotPresent
  postgres: pgvector/pgvector:0.8.2-pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
  redis: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952

runtimeSecretName: insighthub-runtime

config:
  redisUrl: redis://insighthub-redis:6379/0
  ingestionQueue: insighthub:ingestion
  payloadDir: /app/payloads
  ragMode: fixture
  llmProvider: fixture
  embeddingProvider: fixture
  llmMaxTokens: "1024"
  embeddingDim: "1024"
  embeddingRevision: "1"
  providerTimeoutSeconds: "60"
  apiInternalUrl: http://insighthub-api:8000

postgres:
  initSql: ""
  storage: 2Gi

payloads:
  storage: 1Gi

resources:
  web:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  api:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  worker:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  postgres:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 768Mi}
  redis:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
